name: mvspatialembedding_env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # Deep Learning Frameworks
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=11.8  # Use pytorch-cuda=12.1 if you have CUDA 12.x, or remove for CPU-only
  
  # Core Scientific Computing
  - numpy>=1.24.0
  - pandas>=2.0.0
  
  # Computer Vision
  - opencv>=4.8.0
  
  # Geospatial Libraries
  - rasterio>=1.3.0
  - gdal>=3.6.0
  
  # Visualization
  - matplotlib>=3.7.0
  
  # Utilities
  - pyyaml>=6.0
  
  # Pip packages (not available or better from pip)
  - pip
  - pip:
    - lightning>=2.0.0
    - torchgeo>=0.5.0
    - albumentations>=1.3.0
    - timm>=0.9.0
    - einops>=0.7.0
    - sympy>=1.12
    - tensorboard>=2.14.0

# Create new environment from scratch
# mamba env create -f environment.yml